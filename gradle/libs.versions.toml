[versions]
appVersion = "0.2.0"
appVersionName = "0.2.0"
appId = "com.oldguy.kmpmarkup"

androidGradlePlugin = "9.4.0-alpha04"
javaVersion = "21"
androidBuildTools = "37.0.0"
androidSdk = "37"
# Use 26 for publishing. To avoid JUnit5/6 desugaring issues, use 37 for androidDeviceTest builds/tests
androidSdkMinimum = "26"
#androidSdkMinimum = "37"

kotlin = "2.4.0"
kotlinCoroutines = "1.11.0"
kotlinx-datetime = "0.8.0"

kmpIo = "0.3.1"
bigDecimal = "0.3.10"

dokkaPlugin = "2.2.0"
vannikTech = "0.37.0"

androidxTestRunner = "1.7.0"
jupiter = "6.1.1"
testMannodermausPlugin = "2.0.1"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinCoroutines"}
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

kmp-io = { module = "io.github.skolson:kmp-io", version.ref = "kmpIo" }
bigdecimal = { module = "com.ionspin.kotlin:bignum", version.ref = "bigDecimal"}

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-annotations = { module = "org.jetbrains.kotlin:kotlin-test-annotations-common", version.ref = "kotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinCoroutines"}
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jupiter" }
jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "jupiter" }
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jupiter" }
android-jupiter-test-runner = { module = "de.mannodermaus.junit5:android-test-runner", version.ref = "testMannodermausPlugin" }
android-jupiter-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "jupiter" }
android-jupiter-suite-api = { module = "org.junit.platform:junit-platform-suite-api", version.ref = "jupiter" }

[bundles]
androidx-test = [ "kotlinx-coroutines-test", "kotlinx-coroutines-core", "jupiter-api", "jupiter-params", "jupiter-engine", "androidx-test-runner", "android-jupiter-test-runner", "android-jupiter-launcher", "android-jupiter-suite-api" ]
kotlin-test = [ "kotlin-test", "kotlin-test-annotations", "kotlinx-coroutines-test" ]

[plugins]
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-jupiter = { id = "de.mannodermaus.android-junit5", version.ref = "testMannodermausPlugin" }
maven-publish-vannik = { id = "com.vanniktech.maven.publish", version.ref = "vannikTech" }
dokka-base = { id = "org.jetbrains.dokka", version.ref = "dokkaPlugin" }
